org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
kotlin.mpp.applyDefaultHierarchyTemplate=false

android.useAndroidX=true
android.suppressUnsupportedCompileSdk=36
# Migration to AGP built-in Kotlin (completed):
# All KMP library modules (:core-mpv, :core-vfs, :ui-compose) now use
# com.android.kotlin.multiplatform.library, and :app-android uses AGP's
# built-in Kotlin (org.jetbrains.kotlin.android plugin removed). The
# remaining flags below are still deprecation-warned by AGP 9.x but are
# functionally required to keep the current behavior stable:
#   - resvalues=true:  opt IN to generateDebugResValues tasks (AGP 10 default = false)
#   - r8/r8-strict...=false, R-class=false, manifest.disallowed=false,
#     uniquePackageNames=false, useConstraints=true: opt OUT of AGP 10 defaults
#     that would change bytecode/resource handling. Safe to revisit on AGP 10.
# Note: builtInKotlin / newDsl are no longer set — AGP 9.x defaults (true) apply.
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
org.gradle.configuration-cache=true
