name: CI

# Verifies that every push / PR still compiles for both Desktop (JVM) and
# Android targets, runs the unit tests, and uploads the debug APK so it can
# be downloaded for smoke-testing without a local build environment.
#
# Triggers:
#   - push to master/main
#   - any pull_request

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel in-progress runs of the same branch/PR when new commits arrive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure gradlew is executable
        # On Windows checkouts the execute bit can be lost; restore it so
        # `./gradlew` doesn't fail with "Permission denied" on Linux runners.
        run: chmod +x gradlew

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Accept all SDK licenses up-front (otherwise AGP's auto-download of
          # missing components fails the build with "license not accepted").
          accept-android-sdk-licenses: true

      - name: Install Android SDK components
        # AGP 9.x requires compileSdk=36; install it explicitly so the build
        # doesn't depend on AGP's auto-download (which can be flaky on CI).
        run: |
          set -x
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "platform-tools" "platforms;android-36"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"

      - name: Create local.properties
        # AGP needs sdk.dir even with ANDROID_HOME set, on some configurations.
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # Only write cache entries from the default branch so PR runs don't
          # bloat the cache with one-off dependencies.
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

      - name: Compile Desktop (JVM)
        run: ./gradlew :app-desktop:compileKotlinDesktop --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew :core-vfs:allTests --no-daemon --stacktrace

      - name: Build Android Debug APK
        run: ./gradlew :app-android:assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-android-debug-${{ github.sha }}
          path: app-android/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 7
