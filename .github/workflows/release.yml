name: Release

# Builds distributable artifacts whenever a `v*` tag is pushed and attaches
# them to a GitHub Release.
#
# Artifacts produced:
#   - Android debug APK (unsigned — for sideloading only)
#   - Desktop distribution ZIP (portable JVM bundle via jpackage; runs on
#     any OS with JDK 21)
#
# What's NOT produced here:
#   - Signed Android release APK: requires a keystore (set up later)
#   - Desktop .msi / .deb: requires platform-specific tooling (Windows runner
#     for MSI, dpkg-deb for Deb — can be added as separate jobs)
#
# To cut a release locally:
#   git tag v0.2.0
#   git push origin v0.2.0

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # required by softprops/action-gh-release to create the release

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK components
        run: |
          set -x
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" || true
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1" || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build Android Debug APK
        run: ./gradlew :app-android:assembleDebug --no-daemon --stacktrace

      # Build the desktop distribution. We use `createDistributable` which
      # produces a portable directory with start scripts + all jars — runs on
      # any OS with JDK 21 installed. We zip it up so it's a single download.
      # Requires `jpackage` from JDK 17+ (Temurin JDK 21 on CI has it).
      - name: Build Desktop distribution
        run: ./gradlew :app-desktop:createDistributable --no-daemon --stacktrace

      - name: Stage release artifacts
        run: |
          set -e
          mkdir -p artifacts
          # Android APK
          cp app-android/build/outputs/apk/debug/*.apk \
             "artifacts/WindPlayer-${{ steps.version.version }}-android.apk"
          # Desktop portable distribution (zip the app/ directory)
          cd app-desktop/build/compose/binaries/main
          zip -r "../../../../../artifacts/WindPlayer-${{ steps.version.version }}-desktop.zip" app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WindPlayer ${{ steps.version.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/WindPlayer-${{ steps.version.version }}-android.apk
            artifacts/WindPlayer-${{ steps.version.version }}-desktop.zip
