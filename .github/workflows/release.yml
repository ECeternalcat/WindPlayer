name: Release

# Builds distributable artifacts whenever a `v*` tag is pushed and attaches
# them to a GitHub Release.
#
# Artifacts produced:
#   - Android debug APK (unsigned — for sideloading only)
#   - Desktop distribution ZIP (cross-platform JVM bundle, runs anywhere with JDK 21)
#   - Desktop .deb (Linux package — built on Linux runner)
#
# What's NOT produced here:
#   - Signed Android release APK: requires a keystore (set up later)
#   - Desktop .msi: requires Windows runner (can be added as a separate job)
#
# To cut a release locally:
#   git tag v0.2.0
#   git push origin v0.2.0

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # required by softprops/action-gh-release to create the release

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-36
            build-tools;36.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build Android Debug APK
        run: ./gradlew :app-android:assembleDebug --no-daemon --stacktrace

      # Build the cross-platform JVM distribution (zips a runnable jar + lib deps).
      # `distZip` is the safest cross-platform target — produces a single .zip
      # that runs on Win/Linux/Mac with JDK 21. We skip native packaging (MSI/Deb)
      # here because MSI requires Windows and Deb tooling varies; both can be
      # added as separate jobs later.
      - name: Build Desktop distribution ZIP
        run: ./gradlew :app-desktop:distZip --no-daemon --stacktrace

      - name: Rename artifacts with version
        run: |
          mkdir -p artifacts
          cp app-android/build/outputs/apk/debug/*.apk \
             "artifacts/WindPlayer-${{ steps.version.version }}-android.apk"
          cp app-desktop/build/compose/binaries/main/*.zip \
             "artifacts/WindPlayer-${{ steps.version.version }}-desktop.zip" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WindPlayer ${{ steps.version.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/WindPlayer-${{ steps.version.version }}-android.apk
            artifacts/WindPlayer-${{ steps.version.version }}-desktop.zip
