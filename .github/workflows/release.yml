name: Release

# Builds distributable artifacts whenever a `v*` tag is pushed and attaches
# them to a GitHub Release.
#
# Artifacts produced:
#   - Android debug APK (unsigned — for sideloading only)
#   - Desktop distribution ZIP (Compose Desktop's distZip — a portable JVM
#     bundle of libs + launch scripts; runs on any OS with JDK 21). Not to be
#     confused with jpackage-produced installers (MSI/Deb) which require
#     platform-specific tooling and are not built here.
#
# What's NOT produced here:
#   - Signed Android release APK: requires a keystore (set up later)
#   - Desktop .msi / .deb: requires platform-specific tooling (Windows runner
#     for MSI, dpkg-deb for Deb — can be added as separate jobs)
#
# To cut a release locally:
#   git tag v0.2.0
#   git push origin v0.2.0

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # required by softprops/action-gh-release to create the release

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK components
        run: |
          set -x
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "platform-tools" "platforms;android-36"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build Android Debug APK
        # Pass version info from the git tag so Android versionCode/versionName
        # actually change between releases (triggers in-place upgrade).
        run: |
          VERSION_CODE=$(echo "${{ steps.version.version }}" | tr -cd '[:digit:].' | tr -d '.' | head -c 9)
          ./gradlew :app-android:assembleDebug --no-daemon --stacktrace \
            -PversionCode=${VERSION_CODE} -PversionName=${{ steps.version.version }}

      # Build the desktop distribution using distZip (self-contained JVM bundle
      # with start scripts). AGENTS.md tells contributors to use the same command.
      - name: Build Desktop distribution
        run: ./gradlew :app-desktop:distZip --no-daemon --stacktrace -PpackageVersion=${{ steps.version.version }}

      - name: Stage release artifacts
        run: |
          set -e
          mkdir -p artifacts
          # Android APK
          cp app-android/build/outputs/apk/debug/*.apk \
             "artifacts/WindPlayer-${{ steps.version.version }}-android.apk"
          # Desktop distZip (single self-contained ZIP)
          cp app-desktop/build/distributions/*.zip \
             "artifacts/WindPlayer-${{ steps.version.version }}-desktop.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WindPlayer ${{ steps.version.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/WindPlayer-${{ steps.version.version }}-android.apk
            artifacts/WindPlayer-${{ steps.version.version }}-desktop.zip
